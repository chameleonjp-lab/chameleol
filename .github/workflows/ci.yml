# PR とメインブランチで、判定・保存・通信・データベース・画面の試験を流す。
# 描画演出の通し試験は独立した環境で実行し、残りを4組に分ける。
# 本番の Supabase には接続しない（使い捨ての PostgreSQL サービスを使う）。配備は行わない。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KAMEREORU_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 単体試験（判定・保存・通信・翻訳・共有コードの一致）
        run: npm test
      - name: データベースとサーバー処理の試験
        run: npm run test:sql
      - name: 別の JavaScript エンジン（QuickJS）での照合
        run: npm run check:engines

  browser:
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shard_1: ${{ steps.completed.outputs.shard_1 }}
      shard_2: ${{ steps.completed.outputs.shard_2 }}
      shard_3: ${{ steps.completed.outputs.shard_3 }}
      shard_4: ${{ steps.completed.outputs.shard_4 }}
      shard_5: ${{ steps.completed.outputs.shard_5 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KAMEREORU_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 自動ブラウザの準備
        timeout-minutes: 6
        run: |
          # ランナーの地域別ミラーで止まらないよう、Ubuntu公式HTTPS配信先を指定する。
          cat > "$RUNNER_TEMP/chameleol-ubuntu.list" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu/ noble-security main universe
          SOURCES
          sudo tee /etc/apt/apt.conf.d/99-chameleol-ci >/dev/null <<APT
          Dir::Etc::sourcelist "$RUNNER_TEMP/chameleol-ubuntu.list";
          Dir::Etc::sourceparts "-";
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 自動ブラウザの通し試験（${{ matrix.shard }}）
        env:
          SHARD: ${{ matrix.shard }}
          CL03_SCREENSHOTS: ${{ runner.temp }}/pr26-evidence
        run: |
          presentation_test=tests/e2e/presentation.e2e.mjs
          if [[ "$SHARD" == 5 ]]; then
            node --test --test-concurrency=1 "$presentation_test"
          else
            files=()
            for file in tests/e2e/*.e2e.mjs; do
              if [[ "$file" != "$presentation_test" ]]; then
                files+=("$file")
              fi
            done
            node --test --test-concurrency=1 --test-shard="$SHARD/4" "${files[@]}"
          fi
      - name: PR26の画像と測定を保存（試験の合否は変更しない）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr26-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pr26-evidence/
          if-no-files-found: ignore
      - name: この組の成功を記録
        id: completed
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "shard_${SHARD}=success" >> "$GITHUB_OUTPUT"

  # 既存の必須チェック名 test を維持する。失敗・取消・スキップ時も必ず不合格にする。
  test:
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 全テストの成功を確認
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SHARD_1: ${{ needs.browser.outputs.shard_1 }}
          SHARD_2: ${{ needs.browser.outputs.shard_2 }}
          SHARD_3: ${{ needs.browser.outputs.shard_3 }}
          SHARD_4: ${{ needs.browser.outputs.shard_4 }}
          SHARD_5: ${{ needs.browser.outputs.shard_5 }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
          for result in "$SHARD_1" "$SHARD_2" "$SHARD_3" "$SHARD_4" "$SHARD_5"; do
            test "$result" = success
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 単独動作の公開候補をビルド（配備しない）
        run: npm run build
        env:
          KAMEREORU_ENV: production
          KAMEREORU_STANDALONE: '1'
          KAMEREORU_PUBLIC_URL: https://chameleonjp-kamereoru.chameleonjp.chatgpt.site
      - name: レビュー用の公開ファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: chameleol-standalone-${{ github.sha }}
          path: |
            dist/
            .openai/hosting.json
          include-hidden-files: true
