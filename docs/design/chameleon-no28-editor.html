<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カメレオン No.28 エディター</title>
<style>
:root{--bg:#f1f4ee;--panel:#fff;--ink:#1b2a1b;--sub:#5f705f;--line:#dde5d8;--acc:#4cbf3a;--s1:#fff;--s2:#dce6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a14;--panel:#1c241c;--ink:#e9f2e6;--sub:#9db29a;--line:#2e3b2e;--acc:#5fd04c;--s1:#34413a;--s2:#171d17}}
:root[data-theme="dark"]{--bg:#141a14;--panel:#1c241c;--ink:#e9f2e6;--sub:#9db29a;--line:#2e3b2e;--acc:#5fd04c;--s1:#34413a;--s2:#171d17}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:0 0 46%;background:radial-gradient(circle at 50% 42%,var(--s1),var(--s2))}
canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:5px}
.tools button{padding:5px 10px;font-size:12px}
#hint{position:absolute;left:12px;bottom:20px;font-size:11px;color:var(--sub)}
#panel{flex:1;overflow-y:auto;padding:0 14px 28px;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;margin-top:-12px;position:relative}
#tabs{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 0 8px}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
button.on{background:var(--acc);border-color:var(--acc);color:#06210a;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto}
.wrap{flex-wrap:wrap;overflow:visible}
.pane[hidden]{display:none}
.sw{display:flex;gap:6px}
.sw label{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub);padding:6px 0}
.sw input{width:44px;height:44px;border:0;padding:0;background:none;-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid var(--line);border-radius:50%}
input[type=color]::-moz-color-swatch{border:2px solid var(--line);border-radius:50%}
.dots{display:flex;gap:12px;margin:4px 0 8px}
.dots button{width:30px;height:30px;padding:0;border-radius:50%}
.r{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;margin:9px 0}
.r input{width:100%;accent-color:var(--acc)}
.r i{font-style:normal;font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
textarea{width:100%;height:200px;margin-top:8px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
small{color:var(--sub)}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas>
<div class="tools"><button id="vw">視点 ▶</button><button id="rot" class="on">回転</button><button id="reset">初期化</button></div>
<div id="hint">パーツをタップ → そのパーツの調整タブが開きます</div></div>
<div id="panel"><div id="tabs" class="chips"></div><div id="pb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),cvs=$('#c'),stage=$('#stage');
// [key, label, min, max, default]
const G={
'頭':[['hx','横幅',.8,1.4,1.05],['hy','高さ',.6,1.3,.93],['hz','奥行き',.7,1.4,1],['jaw','あごのすぼみ',0,.7,.3],['hh','位置（上下）',-.4,.4,0],['ht','前への傾き',-.4,.4,0]],
'角':[['cw','根元の太さ',.3,1.3,.8],['ch','高さ',.2,2,.92],['cl','後ろへの傾き',-.3,1,.3],['cc','しなり',1,3,1.8],['cz','前後位置',-.6,.5,-.1]],
'目':[['es','大きさ',.5,1.6,1],['ex','左右位置',.6,1.05,.88],['ey','上下位置',-.3,.6,.12],['ez','前後位置',-.1,.8,.35],['ef','ふくらみ',.3,1.3,.85],['ew','外向き角度',.5,1.6,1.1],['sp','うずの巻き数',1.5,5,3],['sw','うずの太さ',12,44,26]],
'口':[['my','上下位置',-.9,.1,-.5],['mw','幅',.5,1.8,1],['mt','舌の大きさ',.4,1.6,1]],
'胴体':[['tw','横幅',.45,1.1,.8],['td','奥行き',.35,1,.62],['th','高さ',.5,1.1,.8],['tt','上のすぼみ',0,.6,.25]],
'腕':[['ar','太さ',.1,.32,.2],['al','長さ',.4,1.3,.95],['hs','手の大きさ',.5,1.8,1],['fs','指の大きさ',.5,1.8,1],['sx','肩の位置',.4,1.4,.9]],
'脚':[['lr','太さ',.14,.45,.28],['ll','長さ',.3,1.1,.85],['lx','脚の間隔',.2,.6,.34],['fw','足の大きさ',.5,1.6,1],['fz','つま先の大きさ',.5,1.8,1]],
'しっぽ':[['tn','巻き数',.8,3,1.6],['tr','渦の大きさ',.3,1.3,.65],['tk','太さ',.4,1.6,1],['tp','先細り',.3,1,.8]]};
const P={gloss:.45},C={body:'#58c43c',eyeBase:'#72d455',spiral:'#fbfff6',tongue:'#ee8a9e'};
Object.values(G).flat().forEach(r=>P[r[0]]=r[4]);
const D0=JSON.stringify([P,C]);
// [左まぶた,右まぶた,傾き,口の開き,口のカーブ,目の大きさ,口の幅]
const EX={'通常':[0,0,0,.5,-.5,1,1],'閉じ口':[0,0,0,0,-.3,1,.8],'笑顔':[.85,.85,0,.9,-1,1,1.15],'驚き':[0,0,0,.55,0,1.15,.45],'困り':[.3,.3,-.6,0,.7,1,.8],
'怒り':[.5,.5,.8,0,.8,1,.9],'ウインク':[0,1,0,.7,-.7,1,1],'悲しみ':[.4,.4,-.9,0,1,.95,.7],'とぼけ':[.55,.55,0,.15,0,1,.5]};
// [左腕外,左腕前,右腕外,右腕前,左脚,右脚,高さ,前傾]
const PO={
'待機':t=>[.25,0,.25,0,0,0,Math.sin(t*2)*.02,0],
'手を振る':t=>[.25,0,2.5+Math.sin(t*9)*.3,0,0,0,Math.sin(t*2)*.02,-.04],
'歩き':t=>{const s=Math.sin(t*6);return[.2,s*.6,.2,-s*.6,s*.7,-s*.7,Math.abs(Math.cos(t*6))*.06,.08]},
'走り':t=>{const s=Math.sin(t*10);return[.35,s*1.1,.35,-s*1.1,s*1.1,-s*1.1,Math.abs(Math.cos(t*10))*.15,.35]},
'ジャンプ':t=>{const j=Math.abs(Math.sin(t*3));return[2.3,.1,2.3,.1,.5*j,-.3*j,j*1.1,-.1]},
'喜び':t=>[2.6,.2,2.6,.2,0,0,Math.abs(Math.sin(t*5))*.15,-.05],
'座り':t=>[.3,.7,.3,.7,1.45,1.45,-.62,-.05]};
let exT=EX['通常'],poN='待機',auto=true,az=.55,el=.12,dist=13.5,pd=0,moved=0,dirty=1,ta,vi=-1;
const curE=exT.slice(),curP=PO['待機'](0).slice(),VN=['1.正面','2.右斜め前','3.右側面','4.右斜め後','5.背面','6.左斜め後','7.左側面','8.左斜め前'];

const ren=new T.WebGLRenderer({canvas:cvs,antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(32,1,.1,100);
scene.add(new T.HemisphereLight(0xffffff,0xbcd8b4,.75));
const dl=new T.DirectionalLight(0xffffff,.55);dl.position.set(3,7,5);dl.castShadow=true;
dl.shadow.mapSize.set(1024,1024);dl.shadow.bias=-.0005;dl.shadow.normalBias=.03;
Object.assign(dl.shadow.camera,{left:-6,right:6,top:7,bottom:-5,near:1,far:25});dl.shadow.camera.updateProjectionMatrix();scene.add(dl);
const gr=new T.Mesh(new T.PlaneGeometry(30,30),new T.ShadowMaterial({opacity:.22}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;scene.add(gr);

const M=(c,r=.55)=>new T.MeshStandardMaterial({color:c,roughness:r});
const mats={body:M(C.body),tongue:M(C.tongue,.4),inner:M('#7a2a3a',.6),line:M('#2d6e26',.7)};
const ec=document.createElement('canvas');ec.width=1024;ec.height=512;
const eyeMat=new T.MeshStandardMaterial({map:new T.CanvasTexture(ec),roughness:.3});
function drawEye(){const g=ec.getContext('2d'),A=P.sp*Math.PI*2,k=158/A;g.fillStyle=C.eyeBase;g.fillRect(0,0,1024,512);
 g.strokeStyle=C.spiral;g.lineWidth=P.sw;g.lineCap='round';g.lineJoin='round';g.beginPath();
 for(let a=0;a<=A;a+=.05){const r=8+a*k,x=256+Math.cos(a)*r,y=256+Math.sin(a)*r;a?g.lineTo(x,y):g.moveTo(x,y)}
 g.stroke();eyeMat.map.needsUpdate=true}
function applyColors(){mats.body.color.set(C.body);mats.tongue.color.set(C.tongue);
 mats.inner.color.set(C.tongue).multiplyScalar(.4);mats.line.color.set(C.body).multiplyScalar(.45);drawEye()}

// 変形できる球（半径と形状関数をジオメトリに焼き込む）
const ell=(rx,ry,rz,fn,m=mats.body,k='body')=>{const g=new T.SphereGeometry(1,32,24),p=g.attributes.position,n=g.attributes.normal;
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),t=fn?fn(y):1,a=rx*t,c=rz*t;
  p.setXYZ(i,x*a,y*ry,z*c);const nx=n.getX(i)/a,ny=n.getY(i)/ry,nz=n.getZ(i)/c,l=Math.hypot(nx,ny,nz)||1;n.setXYZ(i,nx/l,ny/l,nz/l)}
 const o=new T.Mesh(g,m);o.userData.k=k;return o};
const S=(r,x=1,y=1,z=1,m=mats.body,k='body')=>ell(r*x,r*y,r*z,0,m,k);
function limb(r,l,k){const g=new T.Group(),c=new T.Mesh(new T.CylinderGeometry(r*.9,r,l,20),mats.body);c.userData.k=k;c.position.y=-l/2;
 const e=S(r*.9,1,1,1,mats.body,k);e.position.y=-l;g.add(c,S(r,1,1,1,mats.body,k),e);return g}
class Sp extends T.Curve{getPoint(t,o=new T.Vector3()){const R=P.tr,a=-.5-t*P.tn*2*Math.PI,r=R*(1-.78*t);
 return o.set(0,R*.479+r*Math.sin(a),-R*.878+r*Math.cos(a))}}
const rad=t=>P.tk*(.22*(1-P.tp*t)+.035);
function tube(){const N=140,Rd=14,c=new Sp(),g=new T.TubeGeometry(c,N,1,Rd,false),p=g.attributes.position;
 for(let i=0;i<=N;i++){const q=c.getPointAt(i/N),r=rad(i/N);for(let j=0;j<=Rd;j++){const k=i*(Rd+1)+j;
  p.setXYZ(k,q.x+(p.getX(k)-q.x)*r,q.y+(p.getY(k)-q.y)*r,q.z+(p.getZ(k)-q.z)*r)}}return g}

const root=new T.Group(),body=new T.Group();root.add(body);scene.add(root);let R={};
function clear(g){g.traverse(o=>o.geometry&&o.geometry.dispose());g.clear()}
function build(){clear(body);
 const hip=P.ll+.28,tb=hip-.35,tcy=tb+P.th,tq=tb+2*P.th,cy=P.hy*.74,jw=y=>1-P.jaw*Math.pow(Math.max(0,-y),1.5);
 const torso=ell(P.tw,P.th,P.td,y=>1-P.tt*Math.max(0,y),mats.body,'torso');torso.position.y=tcy;body.add(torso);
 const head=new T.Group();head.position.y=tq+.05+P.hh;head.rotation.x=P.ht;body.add(head);
 const hd=ell(P.hx,P.hy,P.hz,jw,mats.body,'head');hd.position.set(0,cy,.05);head.add(hd);
 const pts=[];for(let i=0;i<=14;i++){const u=i/14;pts.push(new T.Vector2(P.cw*Math.pow(1-u,P.cc)+.004,-.3+u*P.ch*1.5))}
 const cr=new T.Mesh(new T.LatheGeometry(pts,32),mats.body);cr.userData.k='crest';cr.position.set(0,cy+P.hy-.28,P.cz);cr.rotation.x=-P.cl;head.add(cr);
 const eyes=[-1,1].map(s=>{const g=new T.Group(),n=new T.Group();g.position.set(s*P.ex*P.hx,cy+P.ey*P.hy,.05+P.ez*P.hz);g.rotation.set(-.08,s*P.ew,0,'YXZ');n.scale.z=P.ef;
  const ball=new T.Mesh(new T.SphereGeometry(.42,40,28),eyeMat),lid=new T.Mesh(new T.SphereGeometry(.44,32,16,0,Math.PI*2,0,Math.PI/2),mats.body);
  ball.userData.k=lid.userData.k='eye';lid.rotation.order='ZXY';n.add(ball,lid);g.add(n);head.add(g);return{g,lid,s}});
 const yn=P.my,mz=.05+P.hz*jw(yn)*Math.sqrt(Math.max(0,1-yn*yn))-.06,mouth=new T.Group();
 mouth.position.set(0,cy+yn*P.hy,mz);mouth.rotation.x=-yn*.55;head.add(mouth);
 const line=new T.Mesh(new T.TorusGeometry(.26,.016,8,24,Math.PI),mats.line);line.position.z=.06;line.userData.k='mouth';
 const mIn=S(1,1,1,1,mats.inner,'mouth'),tgn=S(1,1,1,1,mats.tongue,'mouth');tgn.position.z=.03;mouth.add(line,mIn,tgn);
 const sh=tq-.25,yb=(sh-tcy)/P.th,wd=P.tw*Math.sqrt(Math.max(0,1-yb*yb))*(1-P.tt*Math.max(0,yb));
 const arm=s=>{const g=limb(P.ar,P.al,'arm');g.rotation.order='ZXY';g.position.set(s*wd*P.sx,sh,.05);
  const h=S(.23*P.hs,1,1.05,.8,mats.body,'arm');h.position.set(0,-P.al-.1*P.hs,.04);g.add(h);
  [[-.13,.25],[0,.32],[.13,.25]].forEach(([x,d])=>{const f=S(.085*P.fs,1,1,1,mats.body,'arm');f.position.set(x*P.hs,-P.al-d*P.hs,.07);g.add(f)});body.add(g);return g};
 const leg=s=>{const g=limb(P.lr,P.ll,'leg');g.position.set(s*P.lx,hip,.05);
  const f=S(.3*P.fw,1,.5,1.35,mats.body,'leg');f.position.set(0,.15*P.fw-hip,.2);g.add(f);
  [-.14,0,.14].forEach(x=>{const t=S(.1*P.fz,1,.9,1,mats.body,'leg');t.position.set(x*P.fw,.15*P.fw-hip-.01,.2+(x?0.32:0.36)*P.fw);g.add(t)});body.add(g);return g};
 const armL=arm(-1),armR=arm(1),legL=leg(-1),legR=leg(1);
 const ty=hip-.28,yr=(ty-tcy)/P.th,tailG=new T.Group();tailG.position.set(0,ty,-P.td*Math.sqrt(Math.max(0,1-yr*yr))+.12);body.add(tailG);
 const tail=new T.Mesh(tube(),mats.body),tip=S(rad(1));tail.userData.k=tip.userData.k='tail';tip.position.copy(new Sp().getPoint(1));tailG.add(tail,tip);
 body.traverse(o=>{if(o.isMesh)o.castShadow=true});
 R={head,eyes,line,mIn,tgn,armL,armR,legL,legR,tailG}}

// ---- UI ----
const UI={},CI={},ptr=new Map(),tabs=$('#tabs'),pb=$('#pb'),pn={},K2T={head:'頭',crest:'角',eye:'目',mouth:'口',torso:'胴体',body:'胴体',arm:'腕',leg:'脚',tail:'しっぽ'};
const code=()=>'const CHAMELEON28 = '+JSON.stringify({P:Object.fromEntries(Object.entries(P).map(([k,v])=>[k,+(+v).toFixed(3)])),C},null,1)+';';
const showCode=()=>{if(ta&&document.activeElement!==ta)ta.value=code()},msg=s=>{$('#msg').textContent=s};
const chg=k=>{dirty=1;if(k=='sp'||k=='sw')drawEye();showCode()};
function syncUI(){Object.values(UI).forEach(f=>f());for(const k in CI)CI[k].value=C[k];showCode()}
function pane(n){const d=document.createElement('div');d.className='pane';d.hidden=true;pb.appendChild(d);pn[n]=d;
 const b=document.createElement('button');b.textContent=n;b.onclick=()=>selTab(n);tabs.appendChild(b);return d}
function selTab(n){for(const k in pn)pn[k].hidden=k!=n;[...tabs.children].forEach(b=>{const on=b.textContent==n;b.classList.toggle('on',on);if(on)tabs.scrollLeft=b.offsetLeft-60})}
function sl(box,[k,l,a,b]){const e=document.createElement('label');e.className='r';
 e.innerHTML='<span>'+l+'</span><input type="range" min="'+a+'" max="'+b+'" step="'+(b-a)/200+'"><i></i>';
 const i=e.children[1],v=e.children[2];UI[k]=()=>{i.value=P[k];v.textContent=(+P[k]).toFixed(2)};
 i.oninput=()=>{P[k]=+i.value;v.textContent=(+i.value).toFixed(2);chg(k)};box.appendChild(e);UI[k]()}
function chips(d,names,fn,i0){const w=document.createElement('div');w.className='chips wrap';d.appendChild(w);
 names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(i==i0)b.className='on';
  b.onclick=()=>{[...w.children].forEach(x=>x.classList.toggle('on',x==b));fn(n)};w.appendChild(b)})}

let d=pane('色');d.innerHTML='<div class="sw" id="sw"></div><div class="dots" id="dots"></div>';
[['body','ボディ'],['eyeBase','目'],['spiral','うず'],['tongue','した']].forEach(([k,l])=>{
 const b=document.createElement('label');b.innerHTML='<input type="color"><span>'+l+'</span>';
 const i=b.firstChild;i.oninput=()=>{C[k]=i.value;applyColors();showCode()};CI[k]=i;$('#sw').appendChild(b)});
['#58c43c','#2fb4d8','#f06fa8','#f5a030','#9468e0','#ef5a45'].forEach(c=>{const b=document.createElement('button');b.style.background=c;
 b.onclick=()=>{C.body=c;C.eyeBase='#'+new T.Color(c).lerp(new T.Color('#ffffff'),.18).getHexString();syncUI();applyColors()};$('#dots').appendChild(b)});
sl(d,['gloss','つや',0,.95]);
for(const n in G){d=pane(n);G[n].forEach(r=>sl(d,r))}
chips(pane('表情'),Object.keys(EX),n=>exT=EX[n],0);
chips(pane('ポーズ'),Object.keys(PO),n=>poN=n,0);
d=pane('コード');d.innerHTML='<small>形・サイズ・色のパラメータだけを書き出します（表情・ポーズなどのモーションは含みません）。コピーして保存し、後で貼り付けて読み込めます。</small><textarea id="code" spellcheck="false"></textarea><div class="row"><button id="cp">コピー</button><button id="imp">貼り付けた内容を読み込む</button><small id="msg"></small></div>';
ta=$('#code');
$('#cp').onclick=async()=>{ta.value=code();ta.focus();ta.setSelectionRange(0,ta.value.length);let ok=0;
 try{await navigator.clipboard.writeText(ta.value);ok=1}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}msg(ok?'コピーしました':'選択しました。長押しでコピーしてください')};
$('#imp').onclick=()=>{try{const s=ta.value,j=JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));
 Object.assign(P,j.P);Object.assign(C,j.C);syncUI();applyColors();dirty=1;msg('読み込みました')}catch(e){msg('形式が正しくありません')}};
$('#rot').onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto)};
$('#reset').onclick=()=>{const[p,c]=JSON.parse(D0);Object.assign(P,p);Object.assign(C,c);syncUI();applyColors();dirty=1;az=.55;el=.12;dist=13.5};
$('#vw').onclick=e=>{if(vi<0)[...pn['表情'].querySelectorAll('button'),...pn['ポーズ'].querySelectorAll('button')].filter(b=>b.textContent=='閉じ口'||b.textContent=='待機').forEach(b=>b.click());
 vi=(vi+1)%8;az=vi*Math.PI/4;el=.05;dist=14;auto=false;$('#rot').classList.remove('on');e.target.textContent='視点 '+VN[vi]};

// ---- 操作 ----
const pdist=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptr.size==2)pd=pdist()});
cvs.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o[0],dy=e.clientY-o[1];
 ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
