<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>legacy80 explicit connection (test only)</title>
    <!-- 旧80の描画と旧modeの互換を明示して検証する入口。通常起動は extended96。 -->
    <meta name="kamereoru-version" content="0.1.0" />
    <meta name="kamereoru-env" content="development" />
    <meta name="kamereoru-api" content="" />
    <meta name="kamereoru-public-url" content="" />
    <link rel="stylesheet" href="/src/ui/game.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.min.js" } }
    </script>
    <script type="module">
      import { App } from '/src/app.js';
      import { createStage } from '/src/scene/stage.js';
      // id を 'app' にしない（app.js が自動起動しないように）。
      const app = new App(document.getElementById('test-root'), {
        stageFactory: (container, options) => createStage(container, { ...options, presentationSet: 'legacy80' }),
      });
      globalThis.__kamereoru = app;
      await app.boot();
      globalThis.__fixtureReady = true;
    </script>
  </head>
  <body>
    <div id="test-root" class="app"></div>
  </body>
</html>
